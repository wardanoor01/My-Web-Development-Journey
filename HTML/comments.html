<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments Tag</title>
</head>
<body>
    Comments in HTML are used to mark text which should not be parsed. They can help document the source code.
    <h1>My Website</h1>
    <!-- This paragraph contains a welcome message -->
    To write text like <!-- This paragraph contains a welcome message --> we press Ctrl + /.
    <p>Welcome to my website!</p>
</body>
</html>
