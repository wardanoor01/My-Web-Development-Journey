<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms in Html</h1>
    <!-- Form starts here -->
    <form action="/submit.php">
        <!-- Text Input for Name -->
         <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Name" required>
         </div>
         <!-- Phone Input -->
          <div>
            <label for="phone">Phone</label>
            <input id="phone" type="telephone number" placeholder="Enter Phone" required>
          </div>
          <!-- Email Input -->
           <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Email" required>
           </div>
           <!-- Password Input -->
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter Password" required>
            </div>
            <!-- Date Input -->
             <div>
                <label for="dob">Date of Birth</label>
                <input id="dob" type="date" required>
             </div>
             <!-- Dropdown (select input) for Gender -->
              <div>
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
              </div>
              <!-- Radio Buttons for Subscription Plan -->
               <div>
                <p>Subscription Plan</p>
                <input id="basic" type="radio" name="subscription" value="basic">
                <label for="basic">Basic</label>
                <input id="premium" type="radio" name="subscription" value="premium">
                <label for="premium">Premium</label>
                <input id="vip" type="radio" name="subscription" value="vip">
                <label for="vip">VIP</label>
               </div>
               <!-- Checkbox for agreeing to Terms -->
                <div>
                    <input id="terms" type="checkbox" required>
                    <label for="termsI agree to the terms and conditions"></label>
                </div>
                <!-- Textarea for Comments -->
                 <div>
                    <label for="comments">Comments</label>
                    <textarea id="comments" placeholder="Enter your comments" rows="4"></textarea>
                 </div>
                 <!-- Submit Button -->
                  <div>
                    <button type="submit">Submit</button>
                  </div>
    </form>
    <!-- Form ends here -->
</body>
</html>
