<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Attributes</title>
</head>
<body>
    <header>
        <nav>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
            If you want your link to open in a new tab, you need to write target="_blank".
        </nav>
    </header>
</body>
</html>
