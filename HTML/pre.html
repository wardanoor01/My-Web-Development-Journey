<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre Tag</title>
</head>
<body>
    Html always ignores extra spaces and newlines. In order to display a piece of text as is, we use pre tag.
    <!-- For Example -->
    <p>
        I
        am
        Warda
        Noor
    </p>
    <!-- Pre Tag -->
    <pre>
        I
        am
        Warda
        Noor
    </pre>
</body>
</html>
