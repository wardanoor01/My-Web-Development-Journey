<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables in HTML</h1>
    <table>
        <!-- Head of the table. -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <!-- Body of the table. -->
        <tbody>
            <tr>
                <td>Warda Noor</td>
                <td>Software Developer</td>
                <td>$7000</td>
            </tr>
            <!-- Colspan -->
            <tr>
                <td>Thank</td>
                <td colspan="2">You</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
